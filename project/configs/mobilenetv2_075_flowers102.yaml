taskname: 'Flowers-102 fine-tune: MobileNetV2-0.75 (baseline)'
common:
  run_label: "flowers102_mobilenetv2"
  log_freq: 20
  auto_resume: true
  mixed_precision: true
  results_loc: "project/results/flowers102_mobilenetv2"
dataset:
  root_train: "project/data/flowers102/train"
  root_val: "project/data/flowers102/val"
  name: "imagenet"
  category: "classification"
  train_batch_size0: 64
  val_batch_size0: 64
  eval_batch_size0: 64
  workers: 4
  persistent_workers: true
  pin_memory: true
image_augmentation:
  random_resized_crop:
    enable: true
    interpolation: "bilinear"
  random_horizontal_flip:
    enable: true
  resize:
    enable: true
    size: 256
    interpolation: "bilinear"
  center_crop:
    enable: true
    size: 224
sampler:
  name: "batch_sampler"
  bs:
    crop_size_width: 224
    crop_size_height: 224
loss:
  category: "classification"
  classification:
    name: "cross_entropy"
    label_smoothing: 0.1
optim:
  name: "sgd"
  weight_decay: 4.e-5
  no_decay_bn_filter_bias: true
  sgd:
    momentum: 0.9
    nesterov: true
scheduler:
  name: "cosine"
  is_iteration_based: false
  max_epochs: 30
  warmup_iterations: 100
  warmup_init_lr: 0.001
  cosine:
    max_lr: 0.01
    min_lr: 0.0001
model:
  classification:
    name: "mobilenetv2"
    activation:
      name: "relu6"
    mobilenetv2:
      width_multiplier: 0.75
  normalization:
    name: "batch_norm"
    momentum: 0.1
  activation:
    name: "relu"
    inplace: false
  layer:
    global_pool: "mean"
    conv_init: "kaiming_normal"
    linear_init: "normal"
ema:
  enable: true
  momentum: 0.0005
stats:
  val: [ "loss", "top1", "top5" ]
  train: ["loss"]
  checkpoint_metric: "top1"
  checkpoint_metric_max: true
